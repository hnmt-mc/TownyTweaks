########################################
##                                    ##
##       TownyTweaks の設定ファイル       ##
##                                    ##
########################################
# TownyTweaks は Towny の追加プラグインです。
# Towny にない機能を、ここでまとめて使えます。どの機能も、いつでも入り切りできます。
# TownyTweaks の機能が Towny 本体に取り込まれたときは、この設定を切って、
# Towny 本体の設定（/plugins/Towny/settings/）で設定することをおすすめします。

# # # # # # # # # # # # # # # # # # # # # # # # # # # #
# 必要な Towny:  0.98.4.0 以上                         #
# 必要な Java:  16 以上                                #
# サーバー:  Paper か、Paper の派生                     #
# Minecraft:  1.16.5 以上                              #
# # # # # # # # # # # # # # # # # # # # # # # # # # # #

townytweaks-prefix: "§e[§bTownyTweaks§e]:§f "
# ゲーム内のメッセージの先頭につける文字です。

enable-armorstand-restriction: false
# false なら、その区画の権限があるかぎり、どこでもアーマースタンドを操作できます。
# true にすると、下の設定で決めた区画の種類でしか操作できなくなります。

allow-armorstand-only-in-plottype: "edit-plot-type-name-here"
# アーマースタンドを操作できる区画の種類の名前に書き換えてください（"edit-plot-type-name-here" の部分）。
# 独自の区画の種類を使うときは、Towny 本体の config.yml の末尾で、その区画を作っておく必要があります。
# この制限を無視させたい管理者には、townytweaks.admin.bypassarmorstand の権限を渡してください。

enable-shulker-restriction: false
# false なら、その区画の権限があるかぎり、どこでもシュルカーボックスを壊したり、開いたりできます。
# true にすると、下の設定で決めた区画の種類でしか使えなくなります。

allow-shulkers-only-in-plottype: "edit-plot-type-name-here"
# シュルカーボックスを使える区画の種類の名前に書き換えてください（"edit-plot-type-name-here" の部分）。
# この制限を無視させたい管理者には、townytweaks.admin.bypassshulkerbox の権限を渡してください。

enable-brew-barrels-restriction: false
# Brewery プラグインを使っていない、または制限したくないときは false のままにしてください。
# true にすると、下の設定で決めた区画の種類でしか、醸造用の樽を使えなくなります。
# 注意: 正しく動くには、Brewery 3.1 以上が必要です。
# ダウンロード: https://github.com/DieReicheErethons/Brewery

allow-barrels-only-in-plottype: "edit-plot-type-name-here"
# 醸造用の樽を使える区画の種類の名前に書き換えてください（"edit-plot-type-name-here" の部分）。
# この制限を無視させたい管理者には、townytweaks.admin.bypassbrew の権限を渡してください。

allow-pearl-in-besieged-towns: false
# （SiegeWar 用）もともとは EarthPol にあった機能で、SiegeWar の主な開発者が離れたため、SiegeWar には取り込まれませんでした。
# true にすると、攻城中の地域にある町へも、町の設定（フラグ）で禁止されていても、エンダーパールでテレポートできます。

spawn-trap-prevention-in-capitals: false
# もともとは EarthMC で、国のスポーン地点で待ち伏せ（スポーンの罠）をされ、不意打ちの PvP になるのを防ぐために作られた機能です。
# EarthPol の開発者の依頼で、SiegeWar でも動くように直しました。もとのコードの大部分は @Warriorrrr が書いています。
